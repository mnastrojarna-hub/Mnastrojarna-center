name: Supabase Deploy

# Automatický deploy DB migrací a Edge Functions do Supabase při push.
# Spustí se jen když jsou nastavené potřebné GitHub Secrets (viz SUPABASE_SETUP.md):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID

on:
  push:
    branches:
      - main
      - claude/cnc-sales-os-ai-cbR2f
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Kontrola secrets
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Supabase secrets nejsou nastavené — deploy přeskočen. Viz SUPABASE_SETUP.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      # Supabase ukládá verzi migrace (časové razítko) jako primární klíč: dvě migrace se stejným razítkem
      # (souběžné větve) shodí nasazení chybou „duplicate key … schema_migrations_pkey“ a nic dalšího se nenasadí.
      - name: Kontrola duplicitních verzí migrací
        if: steps.guard.outputs.ready == 'true'
        run: |
          dups=$(ls supabase/migrations | grep -E '^[0-9]+_' | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Duplicitní verze migrací: $dups — přejmenujte novější soubor na jiné časové razítko (verze je v Supabase primární klíč)."
            exit 1
          fi

      - name: Setup Supabase CLI
        if: steps.guard.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link projektu
        if: steps.guard.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # --include-all: použije i migraci s dřívějším časem, než má poslední nasazená (souběžné PR se mergují
      # v jiném pořadí, než je časové razítko — jinak by push skončil chybou a nenasadila by se žádná další).
      # Všechny migrace jsou idempotentní (if not exists / create or replace / ochranné značky).
      # --yes: nová CLI bez terminálu jinak nic nenasadí („Confirmation required … Nothing was changed").
      - name: Push DB migrací
        if: steps.guard.outputs.ready == 'true'
        run: supabase db push --linked --include-all --yes

      - name: Deploy Edge Functions
        if: steps.guard.outputs.ready == 'true'
        run: |
          if [ -d "supabase/functions" ] && [ -n "$(ls -A supabase/functions 2>/dev/null)" ]; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
          else
            echo "Žádné Edge Functions k nasazení."
          fi
