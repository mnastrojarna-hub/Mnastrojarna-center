<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Mnástrojárna CAD – soubor ke stažení</title>
<link rel="icon" href="/icon.svg">
<style>
  :root { --red: #e03930; --ink: #272425; --grey: #6c6d6f; --bg: #f6f6f7; --card: #fff; --line: #e2e2e4; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ececee; --grey: #a5a6a9; --bg: #1b191a; --card: #272425; --line: #3a3738; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  main { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .en { color: var(--grey); font-size: 13px; margin: 0 0 18px; }
  #st { margin: 0 0 18px; word-break: break-word; }
  #dl { display: inline-block; background: var(--red); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; }
  #dl[hidden] { display: none; }
  dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0 0 18px; font-size: 14px; }
  dl.meta dt { color: var(--grey); }
  dl.meta dd { margin: 0; word-break: break-all; }
  footer { margin-top: 18px; color: var(--grey); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Soubor ke stažení</h1>
  <p class="en">File download · Datei herunterladen</p>
  <p id="st" role="status">Načítám a dešifruji soubor… · Loading…</p>
  <dl class="meta" id="meta" hidden></dl>
  <a id="dl" hidden>Stáhnout</a>
  <footer>Mnástrojárna CAD – soubor je v úložišti zašifrovaný, klíč je jen v odkazu (část za #). · The file is stored encrypted; the key is only in the link.</footer>
</main>
<script>
// Odkaz <web>/cad/soubor/index.html#f=<id>.<klíč> (src/cad/share-file.ts): stáhne šifrovaný obsah z ../share/?id=<id>,
// dešifruje ho (AES-GCM, hlavička MNQ jako AAD), rozbalí (deflate-raw) a nabídne soubor ke stažení. Klíč neopustí prohlížeč.
(async () => {
  const st = document.getElementById("st");
  const dl = document.getElementById("dl");
  const metaEl = document.getElementById("meta");
  const say = (t) => { st.textContent = t; };
  const fail = (t) => { say(t); document.body.dataset.state = "error"; };
  const m = /(?:^#|&)f=([0-9A-Za-z]{8,12})\.([A-Za-z0-9_-]{22})(?![A-Za-z0-9_-])/.exec(location.hash);
  if (!m) return fail("Odkaz není platný – chybí část za #. Zkopírujte celý odkaz. · Invalid link.");
  const unb64u = (s) => { const t = s.replace(/-/g, "+").replace(/_/g, "/"); return Uint8Array.from(atob(t + "=".repeat((4 - (t.length % 4)) % 4)), (c) => c.charCodeAt(0)); };
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
  const size = (n) => (n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1).replace(".", ",") + " kB" : (n / 1048576).toFixed(1).replace(".", ",") + " MB");
  try {
    const res = await fetch("../share/?id=" + encodeURIComponent(m[1]), { credentials: "same-origin", cache: "no-store" });
    if (res.status === 410) return fail("Platnost odkazu vypršela – požádejte odesílatele o nový. · The link has expired.");
    if (res.status === 404 || res.status === 400) return fail("Soubor v úložišti není (smazán nebo vypršel). · File not found.");
    if (!res.ok) return fail("Úložiště není dostupné (" + res.status + "). Zkuste to později. · Storage unavailable.");
    const blob = new Uint8Array(await res.arrayBuffer());
    const MAGIC = [0x4d, 0x4e, 0x51, 0x01];
    if (blob.length < 33 || MAGIC.some((b, i) => blob[i] !== b) || !(blob[4] & 8)) return fail("Odkaz nevede na sdílený soubor. · Not a shared file.");
    const header = blob.subarray(0, 5);
    const key = await crypto.subtle.importKey("raw", unb64u(m[2]), "AES-GCM", false, ["decrypt"]);
    let plain;
    try {
      plain = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.subarray(5, 17), additionalData: header }, key, blob.subarray(17)));
    } catch {
      return fail("Soubor nejde dešifrovat – odkaz je neúplný nebo poškozený. · Cannot decrypt (incomplete link).");
    }
    if (blob[4] & 2) {
      if (typeof DecompressionStream === "undefined") return fail("Prohlížeč neumí rozbalit data (DecompressionStream). Použijte aktuální Chrome, Edge, Firefox nebo Safari.");
      const s = new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      plain = new Uint8Array(await new Response(s).arrayBuffer());
    }
    const n = new DataView(plain.buffer, plain.byteOffset, plain.byteLength).getUint32(0, true);
    const meta = JSON.parse(new TextDecoder().decode(plain.subarray(4, 4 + n)));
    const data = plain.slice(4 + n);
    if (data.length !== meta.bytes || hex(await crypto.subtle.digest("SHA-256", data)) !== meta.sha256) return fail("Soubor je poškozený (otisk nesouhlasí). · File is corrupted.");
    if (meta.exp && Date.now() > meta.exp) return fail("Platnost odkazu vypršela. · The link has expired.");
    const url = URL.createObjectURL(new Blob([data], { type: meta.mime || "application/octet-stream" }));
    dl.href = url;
    dl.download = meta.name;
    dl.textContent = "Stáhnout " + meta.name + " (" + size(meta.bytes) + ")";
    dl.hidden = false;
    const exp = meta.exp ? new Date(meta.exp).toLocaleDateString("cs-CZ") : "–";
    const rows = [["Soubor", meta.name], ["Velikost", size(meta.bytes) + " (" + meta.bytes + " B)"], ["Typ", meta.mime || "–"], ["SHA-256", meta.sha256], ["Platí do", exp]];
    for (const [k, v] of rows) { const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; metaEl.append(dt, dd); }
    metaEl.hidden = false;
    say("Soubor je připravený ke stažení. · Ready to download.");
    window.mncadFile = { name: meta.name, mime: meta.mime, bytes: meta.bytes, sha256: meta.sha256, exp: meta.exp };
    document.body.dataset.state = "ready";
  } catch (e) {
    fail("Soubor nejde otevřít: " + (e && e.message ? e.message : e));
  }
})();
</script>
</body>
</html>
